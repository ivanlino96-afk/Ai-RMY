[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    bblanchon/ArduinoJson@^7

[env:native]
; allows `pio test -e native` to run protocol/soft-limit unit tests on the
; host, without needing an Arduino connected. Only exercises the Arduino-free
; pieces (SerialProtocol, SoftLimits) — AccelStepper/GimbalControl itself only
; targets embedded architectures and isn't linked into this test.
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7
build_flags = -std=gnu++17

[env:uno]
; Full NDJSON commands exceed the default 64-byte UART receive ring.
build_flags = -DSERIAL_RX_BUFFER_SIZE=256
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    bblanchon/ArduinoJson@^6.21

[env:uno_calibration]
extends = env:uno
build_flags = ${env:uno.build_flags} -DGIMBAL_CALIBRATION

[env:native_uno_protocol]
; Exercise the same ArduinoJson 6 fixed-capacity pools used by the Uno.
extends = env:native
lib_deps = bblanchon/ArduinoJson@^6.21
