[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
    bblanchon/ArduinoJson@^7

[env:native]
; allows `pio test -e native` to run protocol/soft-limit unit tests on the
; host, without needing an ESP32 connected. Only exercises the Arduino-free
; pieces (SerialProtocol, SoftLimits) — AccelStepper/GimbalControl itself only
; targets embedded architectures and isn't linked into this test.
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7
build_flags = -std=gnu++17
